<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Barcode Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    font-family:Arial;
    max-width:600px;
    margin:40px auto;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f5f5f5;
    font-size:20px;
}
</style>

</head>
<body>

<h2>Barcode Scanner</h2>

<div id="reader"></div>

<div id="result">
Waiting for scan...
</div>

<script>

function onScanSuccess(decodedText, decodedResult){

    document.getElementById("result").innerHTML =
        "<strong>Barcode:</strong> " + decodedText;

    console.log(decodedResult);

    // Stop after successful scan
    html5QrCode.stop();
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

    if(devices && devices.length){

        html5QrCode.start(
            devices[0].id,
            {
                fps:10,
                qrbox:{
                    width:250,
                    height:150
                }
            },
            onScanSuccess
        );

    }

});

</script>

</body>
</html>
