<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe to Our Newsletter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --accent: #c8553d;
    --muted: #7a756e;
    --border: #e4ddd2;
    --success: #3d7a52;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    background-color: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 1px 2px rgba(28, 26, 23, 0.04);
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 12px;
  }

  p.subtext {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 28px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  label {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  input[type="email"] {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.15s ease;
  }

  input[type="email"]:focus {
    border-color: var(--accent);
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    background-color: var(--accent);
    color: #ffffff;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }

  button:hover {
    background-color: #b04631;
  }

  button:active {
    transform: scale(0.98);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .message {
    font-size: 14px;
    margin-top: 4px;
    min-height: 20px;
  }

  .message.success {
    color: var(--success);
  }

  .message.error {
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Newsletter</div>
  <h1>Stay in the loop</h1>
  <p class="subtext">Get occasional updates delivered straight to your inbox. No spam, unsubscribe anytime.</p>

  <form id="newsletter-form">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
    <button type="submit" id="submit-btn">Subscribe</button>
    <div class="message" id="form-message"></div>
  </form>
</div>

<script>
  const form = document.getElementById('newsletter-form');
  const button = document.getElementById('submit-btn');
  const messageEl = document.getElementById('form-message');
  const WEBHOOK_URL = 'https://rogine.app.n8n.cloud/webhook-test/ae6f7fef-b08e-4538-bff3-7692ff8f9c04?action=call';
  const AUTH_USER = 'test';
  const AUTH_PASS = 'test@123';

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();

    messageEl.textContent = '';
    messageEl.className = 'message';
    button.disabled = true;
    button.textContent = 'Subscribing...';

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Basic ' + btoa(AUTH_USER + ':' + AUTH_PASS)
        },
        body: JSON.stringify({ email: email })
      });

      if (response.ok) {
        messageEl.textContent = "You're subscribed. Thanks for joining!";
        messageEl.classList.add('success');
        form.reset();
      } else {
        messageEl.textContent = 'Something went wrong. Please try again.';
        messageEl.classList.add('error');
      }
    } catch (err) {
      messageEl.textContent = 'Could not reach the server. Please try again.';
      messageEl.classList.add('error');
    } finally {
      button.disabled = false;
      button.textContent = 'Subscribe';
    }
  });
</script>

</body>
</html>
